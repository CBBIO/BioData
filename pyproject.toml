[project]
name = "biodata"
version = "0.1.0"
description = ""
authors = [
    {name = "Ildefonso Cases",email = "icases@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "goatools (>=1.5.2,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pyright = ">=1.1.408,<2.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
