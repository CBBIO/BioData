[project]
name = "biodata"
version = "0.1.0"
description = "CBBIO tools for BioData PostgreSQL access and GO semantic analysis"
authors = [
    {name = "Ildefonso Cases",email = "icases@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "parasail (>=1.3.4,<2.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "goatools (>=1.5.2,<2.0.0)",
    "faiss-cpu (>=1.13.2,<2.0.0) ; python_version >= \"3.13\" and python_version < \"3.15\"",
    "cuvs-cu13 (>=26.4.0,<27.0.0) ; python_version >= \"3.13\" and python_version < \"3.15\"",
    "cupy-cuda13x (>=14.0.1,<15.0.0) ; python_version >= \"3.13\" and python_version < \"3.15\"",
    "lmdb (>=2.2.0,<3.0.0)",
    "torch (>=2.11.0) ; python_version >= \"3.13\" and python_version < \"3.15\"",
    "transformers (>=4.48.1,<5.0.0)",
    "sentencepiece (>=0.2.1,<0.3.0)",
    "protobuf (>=7.35.0,<8.0.0)",
    "fair-esm (>=2.0.0,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pyright (>=1.1.408,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
notebooks = [
    "pandas (>=2.2.0,<3.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "seaborn (>=0.13.0,<0.14.0)",
    "biopython (>=1.84,<2.0.0)",
    "tqdm (>=4.66.0,<5.0.0)",
    "jupyter (>=1.1.0,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "ipywidgets (>=8.1.0,<9.0.0)"
]

[tool.poetry]
package-mode = true
packages = [{ include = "CBBIO" }]

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu130", python = ">=3.13,<3.15"}

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
